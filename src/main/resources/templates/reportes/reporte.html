<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Reporte')}"></head>
<body>
<nav th:replace="~{fragmentos :: menu}"></nav>
<main class="container-fluid px-4 py-4">
  <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-2">
    <div>
      <h1 class="h4 mb-1" th:text="'Reporte ' + ${r.numero} + '. ' + ${r.titulo}"></h1>
      <span class="badge bg-secondary" th:text="'Nivel ' + ${r.nivel}"></span>
      <p class="text-muted mt-2 mb-0" th:text="${r.pregunta}"></p>
    </div>
    <div>
      <a class="btn btn-success" th:href="@{/reportes/{n}/pdf(n=${r.numero}, estado=${filtros['estado']}, desde=${filtros['desde']}, hasta=${filtros['hasta']})}" target="_blank">Exportar a PDF</a>
      <a class="btn btn-outline-secondary" th:href="@{/reportes}">Todos los reportes</a>
    </div>
  </div>

  <form method="get" class="row g-2 align-items-end my-3" th:if="${!#lists.isEmpty(r.filtros)}">
    <div class="col-auto" th:each="f : ${r.filtros}">
      <label class="form-label small mb-0" th:text="${f.etiqueta}"></label>
      <select class="form-select form-select-sm" th:if="${f.tipo == 'lista'}" th:name="${f.nombre}">
        <option value="">Todos</option>
        <option th:each="o : ${f.opciones}" th:value="${o}" th:text="${o}" th:selected="${o == filtros[f.nombre]}"></option>
      </select>
      <input type="date" class="form-control form-control-sm" th:if="${f.tipo == 'fecha'}" th:name="${f.nombre}" th:value="${filtros[f.nombre]}">
    </div>
    <div class="col-auto"><button class="btn btn-sm btn-success">Filtrar</button>
      <a class="btn btn-sm btn-outline-secondary" th:href="@{/reportes/{n}(n=${r.numero})}">Limpiar</a></div>
  </form>

  <div class="card shadow-sm mb-3" th:if="${r.grafico and !#lists.isEmpty(filas)}">
    <div class="card-body"><canvas id="grafico" style="max-height: 340px"></canvas></div>
  </div>

  <p class="small text-muted" th:text="${#lists.size(filas)} + ' filas'"></p>
  <div class="table-responsive" th:if="${!#lists.isEmpty(filas)}">
    <table class="table table-sm table-hover bg-white">
      <thead class="table-success"><tr><th th:each="c : ${columnas}" th:text="${#strings.capitalize(#strings.replace(c, '_', ' '))}"></th></tr></thead>
      <tbody><tr th:each="f : ${filas}">
        <td th:each="c : ${columnas}"
            th:text="${f.get(c) == null ? '' : ((c == 'ingresos' or c == 'valor_total' or c == 'precio_especial') ? '$' + #numbers.formatDecimal(f.get(c), 1, 'POINT', 0, 'COMMA') : f.get(c))}"></td>
      </tr></tbody>
    </table>
  </div>
  <div class="alert alert-info" th:if="${#lists.isEmpty(filas)}">Sin resultados para los filtros escogidos.</div>
</main>
<th:block th:replace="~{fragmentos :: scripts}"></th:block>
<th:block th:if="${r.grafico and !#lists.isEmpty(filas)}">
  <script th:src="@{/webjars/chart.js/4.4.1/dist/chart.umd.js}"></script>
  <script th:inline="javascript">
    new Chart(document.getElementById('grafico'), {
      type: 'bar',
      data: { labels: /*[[${etiquetas}]]*/ [],
              datasets: [{ label: /*[[${#strings.capitalize(#strings.replace(r.columnaValor, '_', ' '))}]]*/ '', data: /*[[${valores}]]*/ [], backgroundColor: '#1f6f43' }] },
      options: { indexAxis: 'y', plugins: { legend: { display: true } } }
    });
  </script>
</th:block>
</body>
</html>
