<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Combos')}"></head>
<body>
<nav th:replace="~{fragmentos :: menu}"></nav>
<main class="container py-4">
  <h1 class="h3">Combos disponibles</h1>
  <div th:replace="~{fragmentos :: mensajes}"></div>
  <div class="row g-3">
    <div class="col-md-4" th:each="c : ${combos}">
      <div class="card shadow-sm h-100"><div class="card-body d-flex flex-column">
        <h2 class="h5" th:text="${c.nombre}"></h2>
        <p class="text-muted flex-grow-1" th:text="${c.descripcion}"></p>
        <p class="h5" th:text="${'$' + #numbers.formatDecimal(c.precioEspecial, 1, 'POINT', 0, 'COMMA')} + ' por unidad'"></p>
        <a class="btn btn-success" th:href="@{/venta/combo/{id}(id=${c.idCombo})}">Escoger</a>
      </div></div>
    </div>
  </div>
</main>
<th:block th:replace="~{fragmentos :: scripts}"></th:block>
</body>
</html>
