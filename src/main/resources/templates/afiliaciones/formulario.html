<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Afiliación')}"></head>
<body>
<nav th:replace="~{fragmentos :: menu}"></nav>
<main class="container py-4">
  <h1 class="h3 mb-3" th:text="${obj.existente} ? 'Editar afiliación' : 'Nueva afiliación'"></h1>
  <div th:replace="~{fragmentos :: mensajes}"></div>
  <form th:action="@{/afiliaciones/guardar}" th:object="${obj}" method="post" class="card card-body shadow-sm">
    <input type="hidden" th:field="*{existente}">
    <div class="row">
      <div class="col-md-4 mb-3"><label class="form-label">Prestador *</label>
        <select class="form-select" th:field="*{idPrestador}" required th:disabled="${obj.existente}">
          <option value="">-- Seleccione --</option>
          <option th:each="o : ${opcPrestador}" th:value="${o.key}" th:text="${o.value}"></option>
        </select>
        <input type="hidden" th:if="${obj.existente}" th:field="*{idPrestador}"></div>
      <div class="col-md-4 mb-3"><label class="form-label">Atracción *</label>
        <select class="form-select" th:field="*{idAtraccion}" required th:disabled="${obj.existente}">
          <option value="">-- Seleccione --</option>
          <option th:each="o : ${opcAtraccion}" th:value="${o.key}" th:text="${o.value}"></option>
        </select>
        <input type="hidden" th:if="${obj.existente}" th:field="*{idAtraccion}"></div>
      <div class="col-md-4 mb-3"><label class="form-label">Fecha de afiliación *</label>
        <input type="date" class="form-control" th:field="*{fechaAfiliacion}" required></div>
    </div>
    <p class="small text-muted" th:if="${obj.existente}">La pareja prestador–atracción es la clave primaria compuesta: no se cambia, solo la fecha.</p>
    <div><button class="btn btn-success">Guardar</button>
      <a class="btn btn-outline-secondary" th:href="@{/afiliaciones}">Volver</a></div>
  </form>
</main>
<th:block th:replace="~{fragmentos :: scripts}"></th:block>
</body>
</html>
