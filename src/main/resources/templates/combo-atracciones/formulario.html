<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Atracciones de los combos')}"></head>
<body>
<nav th:replace="~{fragmentos :: menu}"></nav>
<main class="container py-4">
  <h1 class="h3 mb-3" th:text="${obj.idComboAtraccion == null} ? 'Nuevo registro · atracción del combo' : 'Editar atracción del combo #' + ${obj.idComboAtraccion}"></h1>
  <div th:replace="~{fragmentos :: mensajes}"></div>
  <form th:action="@{/combo-atracciones/guardar}" th:object="${obj}" method="post" class="card card-body shadow-sm">
    <input type="hidden" th:field="*{idComboAtraccion}">
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label" for="idCombo">Combo <span class="text-danger">*</span></label>
        <select class="form-select" th:field="*{idCombo}" required><option value="">-- Seleccione --</option><option th:each="o : ${opcCombo}" th:value="${o.key}" th:text="${o.value}"></option></select>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label" for="idAtraccion">Atracción <span class="text-danger">*</span></label>
        <select class="form-select" th:field="*{idAtraccion}" required><option value="">-- Seleccione --</option><option th:each="o : ${opcAtraccion}" th:value="${o.key}" th:text="${o.value}"></option></select>
      </div>
    </div>
    <div>
      <button class="btn btn-success">Guardar</button>
      <a class="btn btn-outline-secondary" th:href="@{/combo-atracciones}">Volver</a>
    </div>
  </form>
</main>
<th:block th:replace="~{fragmentos :: scripts}"></th:block>
</body>
</html>
