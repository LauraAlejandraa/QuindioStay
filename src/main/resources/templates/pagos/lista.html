<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Pagos')}"></head>
<body>
<nav th:replace="~{fragmentos :: menu}"></nav>
<main class="container-fluid px-4 py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Pagos</h1>
    <a class="btn btn-success" th:href="@{/pagos/nuevo}">+ Nuevo</a>
  </div>
  <div th:replace="~{fragmentos :: mensajes}"></div>
  <input class="form-control mb-2 buscador" placeholder="Buscar en la tabla..." data-tabla="tabla">
  <div class="table-responsive">
    <table id="tabla" class="table table-sm table-hover align-middle tabla-paginada">
      <thead class="table-success">
        <tr><th>ID</th><th>Fecha</th><th>Monto</th><th>Método</th><th>Estado</th><th>Referencia de transacción</th><th>Reserva</th><th class="text-end">Acciones</th></tr>
      </thead>
      <tbody>
        <tr th:each="x : ${lista}">
          <td th:text="${x.idPago}"></td>
          <td th:text="${#temporals.format(x.fecha, 'dd/MM/yyyy')}"></td>
          <td class="text-end" th:text="${'$' + #numbers.formatDecimal(x.monto, 1, 'POINT', 0, 'COMMA')}"></td>
          <td th:text="${x.metodo}"></td>
          <td><span class="badge estado" th:text="${x.estado}"></span></td>
          <td th:text="${x.referenciaTransaccion}"></td>
          <td th:text="${x.idReserva == null ? '' : opcReserva[x.idReserva]}"></td>
          <td class="text-end text-nowrap">
            <a class="btn btn-sm btn-outline-primary" th:href="@{/pagos/{id}/editar(id=${x.idPago})}">Editar</a>
            <form th:if="${x.estado != 'reembolsado'}" th:action="@{/pagos/{id}/eliminar(id=${x.idPago})}" method="post" class="d-inline"
                  onsubmit="return confirm('¿Seguro? Esta acción: reembolsar.');">
              <button class="btn btn-sm btn-outline-danger">Reembolsar</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
<th:block th:replace="~{fragmentos :: scripts}"></th:block>
</body>
</html>
