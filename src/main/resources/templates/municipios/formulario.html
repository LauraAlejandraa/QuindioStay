<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Municipios')}"></head>
<body>
<nav th:replace="~{fragmentos :: menu}"></nav>
<main class="container py-4">
  <h1 class="h3 mb-3" th:text="${obj.idMunicipio == null} ? 'Nuevo registro · municipio' : 'Editar municipio #' + ${obj.idMunicipio}"></h1>
  <div th:replace="~{fragmentos :: mensajes}"></div>
  <form th:action="@{/municipios/guardar}" th:object="${obj}" method="post" class="card card-body shadow-sm">
    <input type="hidden" th:field="*{idMunicipio}">
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label" for="nombre">Nombre <span class="text-danger">*</span></label>
        <input type="text" class="form-control" th:field="*{nombre}" maxlength="60" required>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label" for="codigoDane">Código DANE <span class="text-danger">*</span></label>
        <input type="text" class="form-control" th:field="*{codigoDane}" maxlength="5" pattern="[0-9]{5}" required>
      </div>
    </div>
    <div>
      <button class="btn btn-success">Guardar</button>
      <a class="btn btn-outline-secondary" th:href="@{/municipios}">Volver</a>
    </div>
  </form>
</main>
<th:block th:replace="~{fragmentos :: scripts}"></th:block>
</body>
</html>
