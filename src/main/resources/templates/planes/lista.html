<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Planes')}"></head>
<body>
<nav th:replace="~{fragmentos :: menu}"></nav>
<main class="container-fluid px-4 py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Planes</h1>
    <a class="btn btn-success" th:href="@{/planes/nuevo}">+ Nuevo</a>
  </div>
  <div th:replace="~{fragmentos :: mensajes}"></div>
  <input class="form-control mb-2 buscador" placeholder="Buscar en la tabla..." data-tabla="tabla">
  <div class="table-responsive">
    <table id="tabla" class="table table-sm table-hover align-middle tabla-paginada">
      <thead class="table-success">
        <tr><th>ID</th><th>Nombre</th><th>Tipo</th><th>Precio</th><th>Fecha de inicio</th><th>Fecha de fin</th><th>Estado</th><th>Prestador</th><th class="text-end">Acciones</th></tr>
      </thead>
      <tbody>
        <tr th:each="x : ${lista}">
          <td th:text="${x.idPlan}"></td>
          <td th:text="${x.nombre}"></td>
          <td th:text="${x.tipo}"></td>
          <td class="text-end" th:text="${'$' + #numbers.formatDecimal(x.precio, 1, 'POINT', 0, 'COMMA')}"></td>
          <td th:text="${#temporals.format(x.fechaInicio, 'dd/MM/yyyy')}"></td>
          <td th:text="${#temporals.format(x.fechaFin, 'dd/MM/yyyy')}"></td>
          <td><span class="badge estado" th:text="${x.estado}"></span></td>
          <td th:text="${x.idPrestador == null ? '' : opcPrestador[x.idPrestador]}"></td>
          <td class="text-end text-nowrap">
            <a class="btn btn-sm btn-outline-primary" th:href="@{/planes/{id}/editar(id=${x.idPlan})}">Editar</a>
            <form th:if="${x.estado != 'inactivo'}" th:action="@{/planes/{id}/eliminar(id=${x.idPlan})}" method="post" class="d-inline"
                  onsubmit="return confirm('¿Seguro? Esta acción: inactivar.');">
              <button class="btn btn-sm btn-outline-danger">Inactivar</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
<th:block th:replace="~{fragmentos :: scripts}"></th:block>
</body>
</html>
