<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Zonas')}"></head>
<body>
<nav th:replace="~{fragmentos :: menu}"></nav>
<main class="container py-4">
  <h1 class="h3 mb-3" th:text="${obj.idZona == null} ? 'Nuevo registro · zona' : 'Editar zona #' + ${obj.idZona}"></h1>
  <div th:replace="~{fragmentos :: mensajes}"></div>
  <form th:action="@{/zonas/guardar}" th:object="${obj}" method="post" class="card card-body shadow-sm">
    <input type="hidden" th:field="*{idZona}">
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label" for="nombre">Nombre <span class="text-danger">*</span></label>
        <input type="text" class="form-control" th:field="*{nombre}" maxlength="30" required>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label" for="aforo">Aforo <span class="text-danger">*</span></label>
        <input type="number" class="form-control" th:field="*{aforo}" min="1" required>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label" for="precio">Precio <span class="text-danger">*</span></label>
        <input type="number" class="form-control" th:field="*{precio}" step="0.01" min="0" required>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label" for="idFuncion">Función <span class="text-danger">*</span></label>
        <select class="form-select" th:field="*{idFuncion}" required><option value="">-- Seleccione --</option><option th:each="o : ${opcFuncion}" th:value="${o.key}" th:text="${o.value}"></option></select>
      </div>
    </div>
    <div>
      <button class="btn btn-success">Guardar</button>
      <a class="btn btn-outline-secondary" th:href="@{/zonas}">Volver</a>
    </div>
  </form>
</main>
<th:block th:replace="~{fragmentos :: scripts}"></th:block>
</body>
</html>
