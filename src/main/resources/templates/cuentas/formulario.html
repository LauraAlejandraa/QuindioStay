<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Cuentas de clientes')}"></head>
<body>
<nav th:replace="~{fragmentos :: menu}"></nav>
<main class="container py-4">
  <h1 class="h3 mb-3" th:text="${obj.idCuenta == null} ? 'Nuevo registro · cuenta' : 'Editar cuenta #' + ${obj.idCuenta}"></h1>
  <div th:replace="~{fragmentos :: mensajes}"></div>
  <form th:action="@{/cuentas/guardar}" th:object="${obj}" method="post" class="card card-body shadow-sm">
    <input type="hidden" th:field="*{idCuenta}">
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label" for="contrasenaNueva">Contraseña <small class="text-muted" th:if="${obj.idCuenta != null}">(déjela vacía para no cambiarla)</small></label>
        <input type="password" class="form-control" th:field="*{contrasenaNueva}" autocomplete="new-password">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label" for="idCliente">Cliente <span class="text-danger">*</span></label>
        <select class="form-select" th:field="*{idCliente}" required><option value="">-- Seleccione --</option><option th:each="o : ${opcCliente}" th:value="${o.key}" th:text="${o.value}"></option></select>
      </div>
    </div>
    <div>
      <button class="btn btn-success">Guardar</button>
      <a class="btn btn-outline-secondary" th:href="@{/cuentas}">Volver</a>
    </div>
  </form>
</main>
<th:block th:replace="~{fragmentos :: scripts}"></th:block>
</body>
</html>
