<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Cuentas de clientes')}"></head>
<body>
<nav th:replace="~{fragmentos :: menu}"></nav>
<main class="container-fluid px-4 py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Cuentas de clientes</h1>
    <a class="btn btn-success" th:href="@{/cuentas/nuevo}">+ Nuevo</a>
  </div>
  <div th:replace="~{fragmentos :: mensajes}"></div>
  <input class="form-control mb-2 buscador" placeholder="Buscar en la tabla..." data-tabla="tabla">
  <div class="table-responsive">
    <table id="tabla" class="table table-sm table-hover align-middle tabla-paginada">
      <thead class="table-success">
        <tr><th>ID</th><th>Cliente</th><th class="text-end">Acciones</th></tr>
      </thead>
      <tbody>
        <tr th:each="x : ${lista}">
          <td th:text="${x.idCuenta}"></td>
          <td th:text="${x.idCliente == null ? '' : opcCliente[x.idCliente]}"></td>
          <td class="text-end text-nowrap">
            <a class="btn btn-sm btn-outline-primary" th:href="@{/cuentas/{id}/editar(id=${x.idCuenta})}">Editar</a>
            <form th:action="@{/cuentas/{id}/eliminar(id=${x.idCuenta})}" method="post" class="d-inline"
                  onsubmit="return confirm('¿Seguro? Esta acción: eliminar.');">
              <button class="btn btn-sm btn-outline-danger">Eliminar</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
<th:block th:replace="~{fragmentos :: scripts}"></th:block>
</body>
</html>
