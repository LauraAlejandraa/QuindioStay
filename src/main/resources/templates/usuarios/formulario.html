<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Usuarios del sistema')}"></head>
<body>
<nav th:replace="~{fragmentos :: menu}"></nav>
<main class="container py-4">
  <h1 class="h3 mb-3" th:text="${obj.idUsuario == null} ? 'Nuevo registro · usuario' : 'Editar usuario #' + ${obj.idUsuario}"></h1>
  <div th:replace="~{fragmentos :: mensajes}"></div>
  <form th:action="@{/usuarios/guardar}" th:object="${obj}" method="post" class="card card-body shadow-sm">
    <input type="hidden" th:field="*{idUsuario}">
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label" for="nombreUsuario">Nombre de usuario <span class="text-danger">*</span></label>
        <input type="text" class="form-control" th:field="*{nombreUsuario}" maxlength="40" required>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label" for="contrasenaNueva">Contraseña <small class="text-muted" th:if="${obj.idUsuario != null}">(déjela vacía para no cambiarla)</small></label>
        <input type="password" class="form-control" th:field="*{contrasenaNueva}" autocomplete="new-password">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label" for="estado">Estado <span class="text-danger">*</span></label>
        <select class="form-select" th:field="*{estado}" required><option th:each="v : ${ {'activo', 'bloqueado'} }" th:value="${v}" th:text="${v}"></option></select>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label" for="idRol">Rol <span class="text-danger">*</span></label>
        <select class="form-select" th:field="*{idRol}" required><option value="">-- Seleccione --</option><option th:each="o : ${opcRol}" th:value="${o.key}" th:text="${o.value}"></option></select>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label" for="idPrestador">Prestador (solo encargados)</label>
        <select class="form-select" th:field="*{idPrestador}"><option value="">(ninguno)</option><option th:each="o : ${opcPrestador}" th:value="${o.key}" th:text="${o.value}"></option></select>
      </div>
    </div>
    <div>
      <button class="btn btn-success">Guardar</button>
      <a class="btn btn-outline-secondary" th:href="@{/usuarios}">Volver</a>
    </div>
  </form>
</main>
<th:block th:replace="~{fragmentos :: scripts}"></th:block>
</body>
</html>
