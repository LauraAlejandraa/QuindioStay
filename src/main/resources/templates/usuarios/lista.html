<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Usuarios del sistema')}"></head>
<body>
<nav th:replace="~{fragmentos :: menu}"></nav>
<main class="container-fluid px-4 py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Usuarios del sistema</h1>
    <a class="btn btn-success" th:href="@{/usuarios/nuevo}">+ Nuevo</a>
  </div>
  <div th:replace="~{fragmentos :: mensajes}"></div>
  <input class="form-control mb-2 buscador" placeholder="Buscar en la tabla..." data-tabla="tabla">
  <div class="table-responsive">
    <table id="tabla" class="table table-sm table-hover align-middle tabla-paginada">
      <thead class="table-success">
        <tr><th>ID</th><th>Nombre de usuario</th><th>Estado</th><th>Rol</th><th>Prestador (solo encargados)</th><th class="text-end">Acciones</th></tr>
      </thead>
      <tbody>
        <tr th:each="x : ${lista}">
          <td th:text="${x.idUsuario}"></td>
          <td th:text="${x.nombreUsuario}"></td>
          <td><span class="badge estado" th:text="${x.estado}"></span></td>
          <td th:text="${x.idRol == null ? '' : opcRol[x.idRol]}"></td>
          <td th:text="${x.idPrestador == null ? '' : opcPrestador[x.idPrestador]}"></td>
          <td class="text-end text-nowrap">
            <a class="btn btn-sm btn-outline-primary" th:href="@{/usuarios/{id}/editar(id=${x.idUsuario})}">Editar</a>
            <form th:if="${x.estado != 'bloqueado'}" th:action="@{/usuarios/{id}/eliminar(id=${x.idUsuario})}" method="post" class="d-inline"
                  onsubmit="return confirm('¿Seguro? Esta acción: bloquear.');">
              <button class="btn btn-sm btn-outline-danger">Bloquear</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
<th:block th:replace="~{fragmentos :: scripts}"></th:block>
</body>
</html>
