<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Funciones')}"></head>
<body>
<nav th:replace="~{fragmentos :: menu}"></nav>
<main class="container-fluid px-4 py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Funciones</h1>
    <a class="btn btn-success" th:href="@{/funciones/nuevo}">+ Nuevo</a>
  </div>
  <div th:replace="~{fragmentos :: mensajes}"></div>
  <input class="form-control mb-2 buscador" placeholder="Buscar en la tabla..." data-tabla="tabla">
  <div class="table-responsive">
    <table id="tabla" class="table table-sm table-hover align-middle tabla-paginada">
      <thead class="table-success">
        <tr><th>ID</th><th>Fecha</th><th>Hora de apertura</th><th>Hora de cierre</th><th>Estado</th><th>Atracción</th><th class="text-end">Acciones</th></tr>
      </thead>
      <tbody>
        <tr th:each="x : ${lista}">
          <td th:text="${x.idFuncion}"></td>
          <td th:text="${#temporals.format(x.fecha, 'dd/MM/yyyy')}"></td>
          <td th:text="${#temporals.format(x.horaApertura, 'HH:mm')}"></td>
          <td th:text="${#temporals.format(x.horaCierre, 'HH:mm')}"></td>
          <td><span class="badge estado" th:text="${x.estado}"></span></td>
          <td th:text="${x.idAtraccion == null ? '' : opcAtraccion[x.idAtraccion]}"></td>
          <td class="text-end text-nowrap">
            <a class="btn btn-sm btn-outline-primary" th:href="@{/funciones/{id}/editar(id=${x.idFuncion})}">Editar</a>
            <form th:if="${x.estado != 'cancelada'}" th:action="@{/funciones/{id}/eliminar(id=${x.idFuncion})}" method="post" class="d-inline"
                  onsubmit="return confirm('¿Seguro? Esta acción: cancelar.');">
              <button class="btn btn-sm btn-outline-danger">Cancelar</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
<th:block th:replace="~{fragmentos :: scripts}"></th:block>
</body>
</html>
