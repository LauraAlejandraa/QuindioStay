<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Notificaciones')}"></head>
<body>
<nav th:replace="~{fragmentos :: menu}"></nav>
<main class="container py-4">
  <h1 class="h3 mb-3" th:text="${obj.idNotificacion == null} ? 'Nuevo registro · notificación' : 'Editar notificación #' + ${obj.idNotificacion}"></h1>
  <div th:replace="~{fragmentos :: mensajes}"></div>
  <form th:action="@{/notificaciones/guardar}" th:object="${obj}" method="post" class="card card-body shadow-sm">
    <input type="hidden" th:field="*{idNotificacion}">
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label" for="tipo">Tipo <span class="text-danger">*</span></label>
        <select class="form-select" th:field="*{tipo}" required><option th:each="v : ${ {'recordatorio de reserva', 'confirmación de reserva', 'confirmación de pago', 'cambio de estado', 'promoción'} }" th:value="${v}" th:text="${v}"></option></select>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label" for="canal">Canal <span class="text-danger">*</span></label>
        <select class="form-select" th:field="*{canal}" required><option th:each="v : ${ {'correo', 'SMS', 'WhatsApp'} }" th:value="${v}" th:text="${v}"></option></select>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label" for="mensaje">Mensaje <span class="text-danger">*</span></label>
        <textarea class="form-control" rows="2" th:field="*{mensaje}" maxlength="500" required></textarea>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label" for="fechaProgramada">Fecha programada <span class="text-danger">*</span></label>
        <input type="datetime-local" class="form-control" th:field="*{fechaProgramada}" required>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label" for="fechaRealEnvio">Fecha real de envío</label>
        <input type="datetime-local" class="form-control" th:field="*{fechaRealEnvio}">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label" for="estado">Estado <span class="text-danger">*</span></label>
        <select class="form-select" th:field="*{estado}" required><option th:each="v : ${ {'pendiente', 'enviada', 'fallida', 'leída'} }" th:value="${v}" th:text="${v}"></option></select>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label" for="idCliente">Cliente (solo promociones)</label>
        <select class="form-select" th:field="*{idCliente}"><option value="">(ninguno)</option><option th:each="o : ${opcCliente}" th:value="${o.key}" th:text="${o.value}"></option></select>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label" for="idReserva">Reserva (los demás tipos)</label>
        <select class="form-select" th:field="*{idReserva}"><option value="">(ninguno)</option><option th:each="o : ${opcReserva}" th:value="${o.key}" th:text="${o.value}"></option></select>
      </div>
    </div>
    <div>
      <button class="btn btn-success">Guardar</button>
      <a class="btn btn-outline-secondary" th:href="@{/notificaciones}">Volver</a>
    </div>
  </form>
</main>
<th:block th:replace="~{fragmentos :: scripts}"></th:block>
</body>
</html>
