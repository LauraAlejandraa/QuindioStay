<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Notificaciones')}"></head>
<body>
<nav th:replace="~{fragmentos :: menu}"></nav>
<main class="container-fluid px-4 py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Notificaciones</h1>
    <a class="btn btn-success" th:href="@{/notificaciones/nuevo}">+ Nuevo</a>
  </div>
  <div th:replace="~{fragmentos :: mensajes}"></div>
  <input class="form-control mb-2 buscador" placeholder="Buscar en la tabla..." data-tabla="tabla">
  <div class="table-responsive">
    <table id="tabla" class="table table-sm table-hover align-middle tabla-paginada">
      <thead class="table-success">
        <tr><th>ID</th><th>Tipo</th><th>Canal</th><th>Mensaje</th><th>Fecha programada</th><th>Fecha real de envío</th><th>Estado</th><th>Cliente (solo promociones)</th><th>Reserva (los demás tipos)</th><th class="text-end">Acciones</th></tr>
      </thead>
      <tbody>
        <tr th:each="x : ${lista}">
          <td th:text="${x.idNotificacion}"></td>
          <td th:text="${x.tipo}"></td>
          <td th:text="${x.canal}"></td>
          <td th:text="${x.mensaje}"></td>
          <td th:text="${x.fechaProgramada == null ? '' : #temporals.format(x.fechaProgramada, 'dd/MM/yyyy HH:mm')}"></td>
          <td th:text="${x.fechaRealEnvio == null ? '' : #temporals.format(x.fechaRealEnvio, 'dd/MM/yyyy HH:mm')}"></td>
          <td><span class="badge estado" th:text="${x.estado}"></span></td>
          <td th:text="${x.idCliente == null ? '' : opcCliente[x.idCliente]}"></td>
          <td th:text="${x.idReserva == null ? '' : opcReserva[x.idReserva]}"></td>
          <td class="text-end text-nowrap">
            <a class="btn btn-sm btn-outline-primary" th:href="@{/notificaciones/{id}/editar(id=${x.idNotificacion})}">Editar</a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
<th:block th:replace="~{fragmentos :: scripts}"></th:block>
</body>
</html>
