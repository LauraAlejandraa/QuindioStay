<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Prestadores')}"></head>
<body>
<nav th:replace="~{fragmentos :: menu}"></nav>
<main class="container-fluid px-4 py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Prestadores</h1>
    <a class="btn btn-success" th:href="@{/prestadores/nuevo}">+ Nuevo</a>
  </div>
  <div th:replace="~{fragmentos :: mensajes}"></div>
  <input class="form-control mb-2 buscador" placeholder="Buscar en la tabla..." data-tabla="tabla">
  <div class="table-responsive">
    <table id="tabla" class="table table-sm table-hover align-middle tabla-paginada">
      <thead class="table-success">
        <tr><th>ID</th><th>Nombre comercial</th><th>NIT o documento</th><th>RNT</th><th>Teléfono</th><th>Estado</th><th>Municipio</th><th>Tipo de prestador</th><th class="text-end">Acciones</th></tr>
      </thead>
      <tbody>
        <tr th:each="x : ${lista}">
          <td th:text="${x.idPrestador}"></td>
          <td th:text="${x.nombreComercial}"></td>
          <td th:text="${x.nitDocumento}"></td>
          <td th:text="${x.rnt}"></td>
          <td th:text="${x.telefono}"></td>
          <td><span class="badge estado" th:text="${x.estado}"></span></td>
          <td th:text="${x.idMunicipio == null ? '' : opcMunicipio[x.idMunicipio]}"></td>
          <td th:text="${x.idTipoPrestador == null ? '' : opcTipoPrestador[x.idTipoPrestador]}"></td>
          <td class="text-end text-nowrap">
            <a class="btn btn-sm btn-outline-primary" th:href="@{/prestadores/{id}/editar(id=${x.idPrestador})}">Editar</a>
            <form th:if="${x.estado != 'retirado'}" th:action="@{/prestadores/{id}/eliminar(id=${x.idPrestador})}" method="post" class="d-inline"
                  onsubmit="return confirm('¿Seguro? Esta acción: retirar.');">
              <button class="btn btn-sm btn-outline-danger">Retirar</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
<th:block th:replace="~{fragmentos :: scripts}"></th:block>
</body>
</html>
