<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Mi perfil')}"></head>
<body>
<nav th:replace="~{fragmentos :: menu}"></nav>
<main class="container py-4">
  <h1 class="h3">Mi perfil</h1>
  <div th:replace="~{fragmentos :: mensajes}"></div>
  <form th:action="@{/mi-cuenta/perfil}" method="post" class="card card-body shadow-sm mb-4">
    <h2 class="h5">Datos personales</h2>
    <div class="row" th:object="${cliente}">
      <div class="col-md-3 mb-3"><label class="form-label">Primer nombre *</label><input class="form-control" th:field="*{primerNombre}" required maxlength="40"></div>
      <div class="col-md-3 mb-3"><label class="form-label">Segundo nombre</label><input class="form-control" th:field="*{segundoNombre}" maxlength="40"></div>
      <div class="col-md-3 mb-3"><label class="form-label">Primer apellido *</label><input class="form-control" th:field="*{primerApellido}" required maxlength="40"></div>
      <div class="col-md-3 mb-3"><label class="form-label">Segundo apellido</label><input class="form-control" th:field="*{segundoApellido}" maxlength="40"></div>
      <div class="col-md-3 mb-3"><label class="form-label">Tipo de documento *</label>
        <select class="form-select" th:field="*{tipoDocumento}"><option th:each="v : ${ {'cédula de ciudadanía','cédula de extranjería','pasaporte','tarjeta de identidad'} }" th:value="${v}" th:text="${v}"></option></select></div>
      <div class="col-md-3 mb-3"><label class="form-label">Número *</label><input class="form-control" th:field="*{numeroDocumento}" required maxlength="20"></div>
      <div class="col-md-3 mb-3"><label class="form-label">Fecha de nacimiento *</label><input type="date" class="form-control" th:field="*{fechaNacimiento}" required></div>
      <div class="col-md-3 mb-3"><label class="form-label">Ciudad de origen *</label><input class="form-control" th:field="*{ciudadOrigen}" required maxlength="60"></div>
      <div class="col-md-6 mb-3"><label class="form-label">Correo (usuario) *</label><input type="email" class="form-control" th:field="*{email}" required maxlength="100"></div>
      <div class="col-md-6 mb-3"><label class="form-label">Teléfono *</label><input class="form-control" th:field="*{telefono}" required pattern="[0-9]{7,15}"></div>
    </div>
    <h2 class="h5">Preferencias de notificación (RF02)</h2>
    <div class="row" th:object="${perfil}">
      <div class="col-md-3 mb-3"><label class="form-label">Idioma</label>
        <select class="form-select" th:field="*{idioma}"><option th:each="v : ${ {'español','inglés'} }" th:value="${v}" th:text="${v}"></option></select></div>
      <div class="col-md-3 mb-3"><label class="form-label">Canal preferido</label>
        <select class="form-select" th:field="*{canalPreferido}"><option th:each="v : ${ {'correo','SMS','WhatsApp'} }" th:value="${v}" th:text="${v}"></option></select></div>
      <div class="col-md-3 mb-3"><label class="form-label">Recordatorio (días antes)</label>
        <select class="form-select" th:field="*{anticipacionRecordatorio}"><option th:each="v : ${ {1,3,7} }" th:value="${v}" th:text="${v}"></option></select></div>
      <div class="col-md-3 mb-3"><label class="form-label">¿Acepta promociones?</label>
        <select class="form-select" th:field="*{aceptaPromociones}"><option th:each="v : ${ {'sí','no'} }" th:value="${v}" th:text="${v}"></option></select></div>
    </div>
    <div><button class="btn btn-success">Guardar</button>
      <a class="btn btn-outline-dark" th:href="@{/plantillas/autorizacion/{id}(id=${sesion.idCliente})}" target="_blank">Descargar autorización de datos personales</a></div>
  </form>
  <form th:action="@{/mi-cuenta/contrasena}" method="post" class="card card-body shadow-sm" style="max-width: 520px">
    <h2 class="h5">Cambiar contraseña</h2>
    <div class="mb-2"><label class="form-label">Contraseña actual</label><input type="password" name="actual" class="form-control" required></div>
    <div class="mb-2"><label class="form-label">Nueva contraseña (mínimo 8)</label><input type="password" name="nueva" class="form-control" minlength="8" required></div>
    <div><button class="btn btn-outline-success">Cambiar</button></div>
  </form>
</main>
<th:block th:replace="~{fragmentos :: scripts}"></th:block>
</body>
</html>
