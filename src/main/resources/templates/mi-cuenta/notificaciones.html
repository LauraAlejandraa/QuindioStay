<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Mis notificaciones')}"></head>
<body>
<nav th:replace="~{fragmentos :: menu}"></nav>
<main class="container py-4">
  <h1 class="h3">Mis notificaciones</h1>
  <p class="text-muted">Historial de recordatorios, confirmaciones, cambios de estado y promociones (el envío es simulado). La columna «Envío» indica si el mensaje ya se envió o si usted ya lo leyó; no es el estado de la reserva.</p>
  <div th:replace="~{fragmentos :: mensajes}"></div>
  <table id="tabla" class="table table-sm bg-white tabla-paginada align-middle">
    <thead class="table-success"><tr><th>Fecha</th><th>Tipo</th><th>Canal</th><th>Mensaje</th><th title="Estado del envío simulado del mensaje (no es el estado de la reserva)">Envío</th><th></th></tr></thead>
    <tbody>
      <tr th:each="n : ${lista}">
        <td th:text="${#temporals.format(n.fecha_programada, 'dd/MM/yyyy HH:mm')}"></td>
        <td th:text="${n.tipo}"></td><td th:text="${n.canal}"></td><td th:text="${n.mensaje}"></td>
        <td><span class="badge" th:classappend="${n.estado == 'leída' ? 'bg-success' : (n.estado == 'enviada' ? 'bg-info text-dark' : (n.estado == 'fallida' ? 'bg-danger' : 'bg-secondary'))}"
                  th:text="${n.estado == 'pendiente' ? 'por enviar' : (n.estado == 'fallida' ? 'envío fallido' : n.estado)}"></span></td>
        <td class="text-nowrap"><form th:if="${(n.estado == 'enviada' or n.estado == 'pendiente') and !n.fecha_programada.isAfter(ahora)}"
              th:action="@{/mi-cuenta/notificaciones/{id}/leida(id=${n.id_notificacion})}" method="post">
          <button class="btn btn-sm btn-outline-secondary">Marcar como leída</button></form>
          <small class="text-muted" th:if="${n.estado == 'pendiente' and n.fecha_programada.isAfter(ahora)}">programada</small></td>
      </tr>
    </tbody>
  </table>
</main>
<th:block th:replace="~{fragmentos :: scripts}"></th:block>
</body>
</html>
