# =====================================================================
# QuindíoStay · configuración de la aplicación
# Los datos de conexión son los mismos en los dos computadores (acordado
# con la Parte A, ver la bitácora): base quindiostay, usuario quindiostay_app.
# =====================================================================
spring.application.name=QuindioStay
server.port=8080

# Conexión a MySQL (la lee la clase dao/ConexionBD)
quindiostay.bd.url=jdbc:mysql://localhost:3308/quindiostay?useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Bogota
quindiostay.bd.usuario=quindiostay_app
quindiostay.bd.contrasena=camiylau2026

# Thymeleaf: sin caché para ver los cambios de las pantallas al recargar
spring.thymeleaf.cache=false
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.session.timeout=60m
